<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      var path = window.location.pathname;
      if (path.includes('/agendar/')) {
        var slug = path.split('/agendar/')[1].replace(/\/$/, '');
        if (slug) {
          sessionStorage.setItem('pubSlug', slug);
        }
      }
      window.location.replace('https://vyxora.online/');
    })();
  </script>
</head>
<body></body>
</html>
