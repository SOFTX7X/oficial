<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      var path = window.location.pathname;
      var slug = path.replace(/^\//, '').replace(/\/$/, '');
      if (slug) {
        sessionStorage.setItem('pubSlug', slug);
      }
      window.location.replace('https://vyxora.online/');
    })();
  </script>
</head>
<body></body>
</html>
